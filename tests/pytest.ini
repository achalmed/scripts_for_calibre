# tests/pytest.ini — pruebas de scripts_for_calibre: `python3 -m pytest scripts_for_calibre/tests` desde ~/Documents.
# La caché va a la de usuario, nunca al repo (RQ-MAN-07). Las pruebas trabajan sobre copias en un directorio
# temporal: jamás escriben en la metadata.db ni en el zotero.sqlite reales (ola 2, R-6).
[pytest]
testpaths = .
cache_dir = ~/.cache/pytest/scripts_for_calibre
markers =
    caracterizacion: compara el comportamiento actual con el de la referencia (git) sobre copias de las bases reales
