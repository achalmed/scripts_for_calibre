# tests/fuentes/pytest.ini — pruebas del Método Documental (caja de arena): `python3 -m pytest scripts-biblioteca/tests/fuentes`.
# El temporal va al disco, no a /tmp (tmpfs: es RAM): conftest.py fija --basetemp en $XDG_CACHE_HOME/pytest/.
[pytest]
addopts = -p no:cacheprovider
testpaths = .
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
