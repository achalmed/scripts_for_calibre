# tests/pytest.ini — pruebas de biblioteca-studio: `python3 -m pytest biblioteca-studio/tests` desde ~/Documents.
# La caché va a la de usuario, nunca al repo (RQ-MAN-07). Las pruebas trabajan sobre copias en un directorio
# temporal: jamás escriben en la metadata.db ni en el zotero.sqlite reales (ola 2, R-6).
# El temporal va al disco, no a /tmp (tmpfs: es RAM): conftest.py fija --basetemp en
# $XDG_CACHE_HOME/pytest/biblioteca-studio/basetemp; solo se conserva lo de las pruebas que fallan.
[pytest]
testpaths = .
cache_dir = ~/.cache/pytest/biblioteca-studio
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
markers =
    caracterizacion: compara el comportamiento actual con el de la referencia (git) sobre copias de las bases reales
