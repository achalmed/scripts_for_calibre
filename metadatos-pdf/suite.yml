# metadatos-pdf/suite.yml — suite metadatos_calibre: Incrusta los metadatos OPF de Calibre en los PDF (XMP con exiftool) y registra PDF sueltos como libros.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: metadatos-pdf
objetivo: biblioteca
resumen: Incrusta los metadatos OPF de Calibre en los PDF (XMP con exiftool) y registra PDF sueltos como libros.
escribe_en:
- calibre
- archivos
simula_por_defecto: true
comandos:
- 'main.sh                      # menú interactivo (simula)'
- main.sh embed
- main.sh embed --aplicar
- main.sh register
- 'main.sh register --aplicar   # por la puerta: Calibre cerrado, candado y respaldo'
- main.sh limpiar-json --aplicar
estado: activo
depende_de:
- calibredb
- exiftool
- core/shell-lib
- lib/escribir.sh (la puerta)
nota: todo simula por defecto (ola 2a, K5); con --aplicar, embed modifica los PDF, register escribe metadata.db por la puerta y limpiar-json borra los huérfanos.
pruebas: python3 -m pytest scripts_for_calibre/tests   # desde ~/Documents; copias de las bases, nunca las reales
