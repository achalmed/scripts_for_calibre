# studio/suite.yml — suite biblioteca_studio: Biblioteca Studio, el gestor bibliográfico (QML + Kirigami sobre gui-comun 3.0) de la biblioteca.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: biblioteca_studio
objetivo: biblioteca
resumen: 'Gestor bibliográfico sobre la biblioteca de Calibre (QML + Kirigami sobre gui-comun 3.0): el catálogo con portadas, la búsqueda por campo y los filtros por colección, autor, año y tipo; la ficha editorial con la clave para citar, Zotero y la lectura de KOReader; las bandejas de trabajo; las etapas del Método Documental y la coherencia. Cada operación es la CLI de su suite: F5 simula, Ctrl+Intro aplica tras confirmar, con los seis pasos de la puerta a la vista.'
escribe_en:
- calibre
- zotero
simula_por_defecto: true
pruebas: biblioteca-studio/tests/run.sh   # desde ~/Documents; servicios y controladores sobre una biblioteca Calibre de muestra en un temporal (calibredb y calibre-debug si están: metadatos y portadas), cada QML y --smoke con /usr/bin/python3
comandos:
- main.py   # ejecutable; su intérprete es /usr/bin/python3 (el Qt del sistema, con Kirigami)
- main.py biblioteca-studio://libro/48
- main.py --smoke
- install.sh
estado: activo
interfaz: gui
depende_de:
- /usr/bin/python3 con PySide6 del sistema (python3-pyside6.*) y Kirigami (qml6-module-org-kde-kirigami)
- gui-comun 3.0 (módulo QML GuiComun: VentanaBase, escritorio, estados de operación)
- las suites de este repo (escriben por lib/escribir*, la puerta)
nota: 'No escribe por su cuenta ni abre las bases (lo editorial lo lee lib/indice.editorial en solo lectura; las portadas, en miniatura a su caché): corre la CLI de cada suite, primero simulando (F5); «Aplicar» (Ctrl+Intro) confirma con la orden exacta y los pasos de la puerta, y se desactiva con Calibre o Zotero abiertos o el candado ocupado.'
