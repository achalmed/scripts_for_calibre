# script_metadatos_calibre/suite.yml — suite metadatos_calibre: Incrusta los metadatos OPF de Calibre en los PDF (XMP con exiftool) y registra PDF sueltos como libros.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: metadatos_calibre
objetivo: biblioteca
resumen: Incrusta los metadatos OPF de Calibre en los PDF (XMP con exiftool) y registra PDF sueltos como libros.
escribe_en:
- calibre
- archivos
simula_por_defecto: false
comandos:
- 'main.sh                      # menú interactivo'
- main.sh embed --dry-run
- main.sh embed
- main.sh register --dry-run
- main.sh limpiar-json --aplicar
estado: activo
depende_de:
- calibredb
- exiftool
- core/shell-lib
nota: embed y register escriben salvo --dry-run; --aplicar solo lo lee limpiar-json, que sin él lista los huérfanos y no borra.
