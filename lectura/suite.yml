# lectura/suite.yml — suite ecosistema_lectura: Lleva el tiempo de lectura de Zotero (readingTime) y los metadatos de estudio a las columnas de Calibre.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: lectura
objetivo: biblioteca
resumen: Lleva el tiempo de lectura de Zotero (readingTime) y los metadatos de estudio a las columnas de Calibre.
escribe_en:
- calibre
simula_por_defecto: true
comandos:
- 'main.sh                      # simula'
- main.sh --aplicar
- main.sh --metadatos --desde-timer
- 'main.sh --enlazar --ris          # informe y .ris de lo que falta en Zotero'
- 'main.sh --enlazar --aplicar      # escribe las claves «adjunto»'
estado: activo
depende_de:
- calibredb
- zotero.sqlite
- core/shell-lib
- lib/escribir.sh (la puerta)
timer: ecosistema-lectura.timer · ecosistema-metadatos.timer
pruebas: python3 -m pytest scripts_for_calibre/tests   # desde ~/Documents; copias de las bases, nunca las reales
