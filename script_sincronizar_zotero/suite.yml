# suite.yml — contrato de la suite (esquema en core/suite.schema.yml); core/suites.py generar escribe los índices y READMEs.
nombre: sincronizar_zotero
objetivo: biblioteca
resumen: 'Sincroniza en las dos direcciones los metadatos de los libros enlazados por #zotero_key entre Calibre y Zotero, con backups e integridad.'
escribe_en:
- calibre
- zotero
simula_por_defecto: true
comandos:
- 'main.sh                      # simula y reporta'
- 'main.sh --aplicar            # ambas apps cerradas'
estado: activo
depende_de:
- calibredb
- zotero.sqlite
- lib_comun
